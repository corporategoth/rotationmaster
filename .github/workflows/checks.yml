# Branch checks run on GitHub as well as the Gitea workflow; only release.yml publishes.
name: Offline checks

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.gitea/actions/toolchain
        with:
          pre-commit: 'true'
      - name: Pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure --color never
      - name: Validate workflow files
        run: .venv-ci/bin/python tools/lint_workflows.py --require-yaml

  tests:
    name: Tests (${{ matrix.runtime }})
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runtime: [lua5.1, luajit, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: ./.gitea/actions/toolchain
      - name: Run the suite
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: python3 tools/check_all.py --runtime "${RUNTIME}" --baseline tools/known_failures.txt

  package:
    name: Release package
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - uses: ./.gitea/actions/toolchain
      - name: Build and check the package
        run: python3 tools/package_release.py --check --out dist
      - name: Compare with the BigWigs packager
        run: python3 tools/package_release.py --parity
