# GitHub publishes to addon sites and attaches the verified ZIP to its own release. Gitea publishes its own release.
name: Publish addon

on:
  push:
    tags:
      - '[0-9]*'
      - 'v[0-9]*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish
        required: true
        type: string
      dry_run:
        description: Build and check without uploading
        required: false
        default: true
        type: boolean

concurrency:
  group: addon-publish-${{ github.event.inputs.tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  TAG: ${{ github.event.inputs.tag || github.ref_name }}
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.dry_run != 'false' }}

jobs:
  static:
    name: Static checks
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: ./.gitea/actions/toolchain
        with:
          pre-commit: 'true'
      - name: Pre-commit checks
        run: pre-commit run --all-files --show-diff-on-failure --color never
      - name: Validate Gitea workflow files
        run: .venv-ci/bin/python tools/lint_workflows.py --require-yaml

  tests:
    name: Tests (${{ matrix.runtime }})
    needs: [static]
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        runtime: [lua5.1, luajit, python]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
      - uses: ./.gitea/actions/toolchain
      - name: Run the suite
        env:
          RUNTIME: ${{ matrix.runtime }}
        run: python3 tools/check_all.py --runtime "${RUNTIME}"

  publish:
    name: Package and publish
    needs: [static, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: refs/tags/${{ github.event.inputs.tag || github.ref_name }}
          fetch-depth: 0
      - uses: ./.gitea/actions/toolchain
      - name: Verify tag and master ancestry
        run: |
          set -euo pipefail
          git tag --points-at HEAD | grep -Fx -- "${TAG}"
          git merge-base --is-ancestor HEAD origin/master
      - name: Release plan
        id: plan
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WOWI_UPLOAD_BETA: ${{ vars.WOWI_UPLOAD_BETA }}
        run: |
          set -euo pipefail
          args=(--tag "${TAG}")
          [ "${DRY_RUN}" = "true" ] && args+=(--dry-run)
          [ "${WOWI_UPLOAD_BETA}" = "true" ] && args+=(--wowi-beta)
          python3 tools/release_plan.py "${args[@]}" | tee plan.env
          cat plan.env >> "${GITHUB_OUTPUT}"
      - name: Release notes
        env:
          BETA_GUIDE_URL: ${{ vars.BETA_GUIDE_URL }}
          RELEASE_TYPE: ${{ steps.plan.outputs.type }}
        run: |
          set -euo pipefail
          args=()
          [ "${RELEASE_TYPE}" = "release" ] && args+=(--require-curated)
          [ -n "${BETA_GUIDE_URL}" ] && args+=(--beta-url "${BETA_GUIDE_URL}")
          python3 tools/release_notes.py --tag "${TAG}" --target curseforge --out CHANGELOG.md "${args[@]}"
          python3 tools/release_notes.py --tag "${TAG}" --target gitea --out release-notes-github.md "${args[@]}"
      - name: Build and check the package
        run: |
          set -euo pipefail
          expected="$(jq -r .sha256 tools/vendor/bigwigs-packager/UPSTREAM.json)"
          echo "${expected}  tools/vendor/bigwigs-packager/release.sh" | sha256sum -c -
          python3 tools/package_release.py --tag "${TAG}" --check --out "${GITHUB_WORKSPACE}/.release"
          sha256sum ".release/RotationMaster-${TAG}.zip" > .release/package.sha256
      - name: Publish GitHub release
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ steps.plan.outputs.prerelease }}
        run: |
          set -euo pipefail
          zip=".release/RotationMaster-${TAG}.zip"
          sha256sum -c .release/package.sha256
          if ! gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            flags=()
            [ "${PRERELEASE}" = "true" ] && flags+=(--prerelease)
            gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --verify-tag --title "${TAG}" \
              --notes-file release-notes-github.md "${flags[@]}" || gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null
          fi
          gh release edit "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" \
            --notes-file release-notes-github.md --prerelease="${PRERELEASE}"
          digest="$(gh release view "${TAG}" --repo "${GITHUB_REPOSITORY}" --json assets \
            | jq -r --arg asset "RotationMaster-${TAG}.zip" '.assets[] | select(.name == $asset) | .digest // "missing"')"
          if [ -z "${digest}" ]; then
            gh release upload "${TAG}" "${zip}" --repo "${GITHUB_REPOSITORY}"
          else
            expected="sha256:$(sha256sum "${zip}" | cut -d ' ' -f1)"
            if [ "${digest}" != "${expected}" ]; then
              # ZIP compression differs across zlib implementations. Reuse the published archive only when every
              # entry and its contents match the newly checked build; the addon sites then receive those same bytes.
              existing_dir=".release/existing"
              gh release download "${TAG}" --repo "${GITHUB_REPOSITORY}" --pattern "RotationMaster-${TAG}.zip" --dir "${existing_dir}" || { echo 'Existing release asset differs from the checked ZIP.' >&2; exit 1; }
              existing="${existing_dir}/RotationMaster-${TAG}.zip"
              downloaded="sha256:$(sha256sum "${existing}" | cut -d ' ' -f1)"
              [ "${downloaded}" = "${digest}" ] || { echo 'Existing release asset digest did not match GitHub.' >&2; exit 1; }
              python3 - "${zip}" "${existing}" <<'PY'
          import hashlib, sys, zipfile
          def entries(path):
              with zipfile.ZipFile(path) as archive:
                  infos = archive.infolist()
                  names = [info.filename for info in infos]
                  if len(names) != len(set(names)):
                      raise ValueError('duplicate ZIP entries')
                  result = {}
                  for info in infos:
                      digest = hashlib.sha256()
                      with archive.open(info) as stream:
                          while chunk := stream.read(1024 * 1024):
                              digest.update(chunk)
                      result[info.filename] = (info.file_size, info.external_attr, digest.digest())
                  return result
          try:
              if entries(sys.argv[1]) != entries(sys.argv[2]):
                  raise ValueError('different entries')
          except (OSError, ValueError, zipfile.BadZipFile) as error:
              print('Existing release asset differs from the checked ZIP: ' + str(error), file=sys.stderr)
              raise SystemExit(1)
          PY
              cp "${existing}" "${zip}"
              sha256sum "${zip}" > .release/package.sha256
              echo 'Equivalent release asset reused for addon site uploads.'
            fi
          fi
      - name: Upload to addon sites
        if: ${{ env.DRY_RUN != 'true' }}
        env:
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          PACKAGER_FLAGS: ${{ steps.plan.outputs.packager }}
        run: |
          set -euo pipefail
          read -r -a args <<< "${PACKAGER_FLAGS}"
          sha256sum -c .release/package.sha256
          # The vendored uploader accepts an existing archive via these variables. Keep its staging directory,
          # skip copying and zipping, and upload precisely the file checked above to every selected site.
          export archive="${GITHUB_WORKSPACE}/.release/RotationMaster-${TAG}.zip"
          export archive_name="RotationMaster-${TAG}.zip" archive_label="${TAG}" archive_version="${TAG}"
          bash tools/vendor/bigwigs-packager/release.sh "${args[@]}" -c -z -o -r "${GITHUB_WORKSPACE}/.release"
